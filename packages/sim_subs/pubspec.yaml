name: sim_subs
description: Android helpers - active SIM subscription ids (dual SIM) and an SMS with the last GPS fix when the phone shuts down or enters airplane mode.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.myfamily.sim_subs
        pluginClass: SimSubsPlugin
